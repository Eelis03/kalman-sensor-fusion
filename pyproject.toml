[project]
name = "kalman-sensor-fusion"
version = "0.1.0"
description = "Extended and unscented Kalman filters fusing simulated radar and lidar with NIS consistency validation."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Emre Yilmaz" }]
keywords = ["autonomous-driving", "sensor-fusion", "kalman-filter", "tracking", "python"]
dependencies = ["numpy>=2.0", "scipy>=1.14", "matplotlib>=3.9"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8", "mypy>=1.13"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sensor_fusion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: excluded from the default run"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/sensor_fusion"]

# SciPy ships no type information for scipy.stats. Only chi2.ppf is used from it,
# and every call site converts the result to a float immediately.
[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true
