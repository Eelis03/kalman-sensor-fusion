name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The workflow only ever reads the repository. Narrowing the token here means a
# compromised dependency of any step cannot write to the repository, open a pull
# request, or publish a package under this identity.
permissions:
  contents: read

# A second push to the same branch makes the run already in flight irrelevant,
# so it is cancelled rather than left to finish against a superseded commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The package declares requires-python >=3.12, so every version that
        # declaration admits is tested rather than assumed.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --all-extras --dev

      # The floor is the measured 98 percent rounded down and reduced by two, so
      # that a small refactor does not fail the build while a module arriving
      # with no tests at all does. Figures are not compared byte for byte
      # anywhere in this workflow: matplotlib output is not byte reproducible
      # across platforms or across its own releases, so such a check would fail
      # for reasons that have nothing to do with this package. The code paths
      # that draw them are exercised by the test suite instead.
      - name: Run tests with coverage
        run: >
          uv run --python ${{ matrix.python-version }} pytest -q
          --cov=src/sensor_fusion --cov-report=term-missing --cov-fail-under=96

      - name: Lint
        run: uv run --python ${{ matrix.python-version }} ruff check .

      - name: Check formatting
        run: uv run --python ${{ matrix.python-version }} ruff format --check .

      - name: Type check
        run: uv run --python ${{ matrix.python-version }} mypy
