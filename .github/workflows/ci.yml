name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python 3.12 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # The floor is the measured 98 percent rounded down and reduced by two, so
      # that a small refactor does not fail the build while a module arriving
      # with no tests at all does. Figures are not compared byte for byte
      # anywhere in this workflow: matplotlib output is not byte reproducible
      # across platforms or across its own releases, so such a check would fail
      # for reasons that have nothing to do with this package. The code paths
      # that draw them are exercised by the test suite instead.
      - name: Run tests with coverage
        run: >
          uv run pytest -q --cov=src/sensor_fusion --cov-report=term-missing
          --cov-fail-under=96

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy
